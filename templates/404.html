{% extends 'base.html' %}

{% block title %}Page Not Found – Scholar Track{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h2 class="fw-bold text-dark mb-2">Scholarship Not Found</h2>
    <p class="text-secondary mb-4">

    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">

      <a href="{{ url_for('scholarships') }}" class="btn btn-primary">
        <i class="bi bi-collection-fill me-1"></i>Browse Scholarships
