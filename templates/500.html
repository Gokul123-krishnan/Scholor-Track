{% extends 'base.html' %}

{% block title %}Server Error – Scholar Track{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h2 class="fw-bold text-dark mb-2">Unexpected Server Error</h2>
    <p class="text-secondary mb-4">
      An unexpected database or application error occurred while processing your request. Please try again.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-house-door me-1"></i>Back to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
